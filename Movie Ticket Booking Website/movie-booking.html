<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Showtime – Book movie tickets</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;600&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #f4f4f8;
      --surface: #fff;
      --ink: #1b1d2e;
      --muted: #667;
      --line: #e1e2ec;
      --accent: #e5214a;
      --on-accent: #fff;
      --bar: #1b1d2e;
      --on-bar: #fff;
      --seat: #fff;
      --booked: #d5d7e3;
      --ok: #1f9d55;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    @media (prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --bg: #12131d;
        --surface: #1c1e2d;
        --ink: #eef0f8;
        --muted: #9a9eb5;
        --line: #2d3046;
        --accent: #ff4d6d;
        --bar: #0b0c14;
        --seat: #262940;
        --booked: #3a3d57
      }
    }

    :root[data-theme="dark"] {
      --bg: #12131d;
      --surface: #1c1e2d;
      --ink: #eef0f8;
      --muted: #9a9eb5;
      --line: #2d3046;
      --accent: #ff4d6d;
      --bar: #0b0c14;
      --seat: #262940;
      --booked: #3a3d57
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 400 16px/1.5 Figtree, system-ui, sans-serif
    }

    h1,
    h2,
    h3,
    .logo {
      font-family: 'Bricolage Grotesque', Figtree, sans-serif;
      margin: 0;
      letter-spacing: -.01em
    }

    button,
    select,
    input {
      font: inherit;
      color: inherit
    }

    button {
      cursor: pointer
    }

    :focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px
    }

    .wrap {
      max-width: 1180px;
      margin: 0 auto;
      padding: 0 20px
    }

    header {
      background: var(--bar);
      color: var(--on-bar);
      position: sticky;
      top: env(safe-area-inset-top, 0px);
      z-index: 20
    }

    .top {
      display: flex;
      gap: 14px;
      align-items: center;
      padding: 12px 0;
      flex-wrap: wrap
    }

    .logo {
      font-size: 26px;
      font-weight: 800;
      cursor: pointer;
      background: none;
      border: 0;
      color: var(--on-bar);
      padding: 0
    }

    .logo b {
      color: var(--accent)
    }

    .search {
      flex: 1;
      min-width: 200px;
      padding: 10px 14px;
      border-radius: 8px;
      border: 0;
      background: #ffffff1f;
      color: #fff
    }

    .search::placeholder {
      color: #cfd1e3
    }

    .city {
      padding: 10px;
      border-radius: 8px;
      border: 0;
      background: #ffffff1f;
      color: #fff
    }

    .city option {
      color: #000
    }

    .btn {
      background: var(--accent);
      color: var(--on-accent);
      border: 0;
      border-radius: 8px;
      padding: 10px 18px;
      font-weight: 600
    }

    .btn.ghost {
      background: transparent;
      color: inherit;
      border: 1px solid #ffffff55
    }

    .btn[disabled] {
      opacity: .45;
      cursor: not-allowed
    }

    main {
      padding: 24px 0 80px
    }

    .view[hidden] {
      display: none
    }

    /* hero */
    .hero {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      min-height: 300px;
      display: flex;
      align-items: flex-end;
      color: #fff;
      transition: background .4s
    }

    .hero .in {
      padding: 32px;
      max-width: 640px
    }

    .hero h1 {
      font-size: clamp(34px, 6vw, 64px);
      font-weight: 800;
      line-height: 1.02
    }

    .hero p {
      margin: 10px 0 18px;
      opacity: .9
    }

    .dots {
      position: absolute;
      right: 20px;
      bottom: 20px;
      display: flex;
      gap: 8px
    }

    .dots button {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 0;
      background: #ffffff66;
      padding: 0
    }

    .dots button[aria-current="true"] {
      background: #fff;
      width: 26px;
      border-radius: 6px
    }

    /* filters */
    .bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 30px 0 16px;
      gap: 12px;
      flex-wrap: wrap
    }

    .bar h2 {
      font-size: 26px
    }

    .chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap
    }

    .chip {
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: 999px;
      padding: 6px 16px
    }

    .chip[aria-pressed="true"] {
      background: var(--ink);
      color: var(--bg);
      border-color: var(--ink)
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 20px
    }

    .card {
      background: none;
      border: 0;
      padding: 0;
      text-align: left
    }

    .poster {
      aspect-ratio: 2/3;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: #fff;
      position: relative;
      overflow: hidden
    }

    .poster h3 {
      font-size: 24px;
      font-weight: 800;
      line-height: 1.05
    }

    .poster small {
      opacity: .85
    }

    .card:hover .poster {
      transform: translateY(-4px)
    }

    .poster {
      transition: transform .2s
    }

    .rate {
      align-self: flex-start;
      background: #000a;
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 13px;
      font-weight: 600
    }

    .card .t {
      font-weight: 600;
      margin-top: 8px
    }

    .card .g {
      color: var(--muted);
      font-size: 14px
    }

    .empty {
      color: var(--muted);
      padding: 40px 0
    }

    /* detail */
    .back {
      background: none;
      border: 0;
      color: var(--muted);
      padding: 0 0 14px;
      font-weight: 600
    }

    .banner {
      border-radius: 16px;
      color: #fff;
      padding: 28px;
      display: flex;
      gap: 28px;
      flex-wrap: wrap;
      align-items: center
    }

    .banner .poster {
      width: 190px;
      aspect-ratio: 2/3;
      flex: none
    }

    .banner h1 {
      font-size: clamp(30px, 5vw, 48px);
      font-weight: 800
    }

    .meta {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 12px 0
    }

    .meta span {
      background: #ffffff2e;
      border-radius: 6px;
      padding: 3px 10px;
      font-size: 14px
    }

    .banner p {
      max-width: 560px;
      margin: 0 0 16px
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 20px;
      margin-top: 22px
    }

    .dates {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 6px
    }

    .date {
      flex: none;
      min-width: 64px;
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: 10px;
      padding: 8px;
      text-align: center;
      line-height: 1.25
    }

    .date[aria-pressed="true"] {
      background: var(--accent);
      color: var(--on-accent);
      border-color: var(--accent)
    }

    .date b {
      display: block;
      font-size: 20px
    }

    .theatre {
      display: flex;
      gap: 20px;
      justify-content: space-between;
      padding: 18px 0;
      border-top: 1px solid var(--line);
      flex-wrap: wrap
    }

    .theatre:first-of-type {
      border-top: 0
    }

    .theatre h3 {
      font-size: 18px
    }

    .theatre p {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 14px
    }

    .times {
      display: flex;
      gap: 10px;
      flex-wrap: wrap
    }

    .time {
      border: 1px solid var(--ok);
      color: var(--ok);
      background: transparent;
      border-radius: 8px;
      padding: 8px 14px;
      font-weight: 600;
      line-height: 1.2
    }

    .time small {
      display: block;
      font-weight: 400;
      color: var(--muted);
      font-size: 12px
    }

    .time[disabled] {
      border-color: var(--line);
      color: var(--muted);
      cursor: not-allowed;
      text-decoration: line-through
    }

    /* seats */
    .seatwrap {
      overflow-x: auto
    }

    .seatmap {
      min-width: 520px;
      margin: 0 auto;
      max-width: 640px
    }

    .screen {
      height: 34px;
      margin: 6px 8% 28px;
      border-radius: 50% 50% 0 0/100% 100% 0 0;
      border-top: 5px solid var(--accent);
      background: linear-gradient(var(--accent), transparent);
      opacity: .35
    }

    .screen-l {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      margin: -22px 0 22px
    }

    .tier {
      margin: 18px 0 6px;
      color: var(--muted);
      font-size: 14px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 4px
    }

    .row {
      display: flex;
      gap: 6px;
      justify-content: center;
      align-items: center;
      margin: 6px 0
    }

    .row i {
      width: 22px;
      font-style: normal;
      color: var(--muted);
      font-size: 13px;
      text-align: center
    }

    .seat {
      width: 32px;
      height: 30px;
      border-radius: 7px 7px 4px 4px;
      border: 1.5px solid var(--ok);
      background: var(--seat);
      font-size: 11px;
      padding: 0;
      color: var(--muted)
    }

    .seat.sel {
      background: var(--ok);
      color: #fff
    }

    .seat:disabled {
      background: var(--booked);
      border-color: var(--booked);
      cursor: not-allowed;
      color: transparent
    }

    .aisle {
      width: 22px
    }

    .legend {
      display: flex;
      gap: 18px;
      justify-content: center;
      margin-top: 24px;
      font-size: 14px;
      color: var(--muted);
      flex-wrap: wrap
    }

    .legend span::before {
      content: "";
      display: inline-block;
      width: 14px;
      height: 14px;
      border-radius: 4px;
      margin-right: 6px;
      vertical-align: -2px;
      border: 1.5px solid var(--ok);
      background: var(--seat)
    }

    .legend .s::before {
      background: var(--ok)
    }

    .legend .b::before {
      background: var(--booked);
      border-color: var(--booked)
    }

    .checkout {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--surface);
      border-top: 1px solid var(--line);
      padding: 12px 0 calc(12px + env(safe-area-inset-bottom, 0px));
      z-index: 15
    }

    .checkout .wrap {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap
    }

    .checkout small {
      color: var(--muted);
      display: block
    }

    /* ticket */
    .ticket {
      max-width: 420px;
      margin: 20px auto;
      background: var(--surface);
      border-radius: 18px;
      border: 1px solid var(--line);
      overflow: hidden
    }

    .ticket .head {
      padding: 22px;
      color: #fff
    }

    .ticket .head h2 {
      font-size: 28px;
      font-weight: 800
    }

    .ticket .body {
      padding: 18px 22px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px
    }

    .ticket .body small {
      color: var(--muted);
      display: block
    }

    .ticket .stub {
      border-top: 2px dashed var(--line);
      padding: 18px 22px;
      text-align: center
    }

    .bars {
      height: 54px;
      margin-top: 10px;
      background: repeating-linear-gradient(90deg, var(--ink) 0 2px, transparent 2px 5px, var(--ink) 5px 6px, transparent 6px 10px)
    }

    .center {
      text-align: center
    }

    #toast {
      position: fixed;
      left: 50%;
      bottom: 90px;
      transform: translateX(-50%);
      background: var(--ink);
      color: var(--bg);
      padding: 10px 18px;
      border-radius: 8px;
      z-index: 50;
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s
    }

    #toast.on {
      opacity: 1
    }

    @media (prefers-reduced-motion:reduce) {
      * {
        transition: none !important
      }
    }

    .hero {
      min-height: 380px
    }

    .promo {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 90px
    }

    .promo input {
      flex: 1;
      min-width: 200px;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--bg)
    }

    #pmsg {
      color: var(--ok);
      font-weight: 600
    }

    .bk {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: center;
      flex-wrap: wrap
    }

    .bk p {
      margin: 4px 0 0;
      color: var(--muted)
    }

    .auth {
      max-width: 440px;
      margin: 10px auto
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 14px
    }

    .tab {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: transparent;
      font-weight: 600
    }

    .tab[aria-pressed="true"] {
      background: var(--ink);
      color: var(--bg);
      border-color: var(--ink)
    }

    #authform label,
    #payform label {
      display: block;
      font-weight: 600;
      margin: 14px 0 4px;
      font-size: 14px
    }

    #authform input:not([type=checkbox]),
    #payform input,
    #payform select {
      width: 100%;
      padding: 11px 12px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--bg)
    }

    #payform input[aria-invalid=true],
    #authform input[aria-invalid=true] {
      border-color: var(--accent)
    }

    .err {
      display: block;
      color: var(--accent);
      min-height: 18px;
      font-size: 13px;
      margin-top: 2px
    }

    #strength {
      color: var(--muted)
    }

    .pw {
      position: relative
    }

    .pw input {
      padding-right: 64px !important
    }

    .eye,
    .link {
      background: none;
      border: 0;
      color: var(--accent);
      font-weight: 600;
      padding: 0
    }

    .eye {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%)
    }

    .aux {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 12px 0;
      gap: 10px;
      flex-wrap: wrap
    }

    #authform .chk {
      display: flex;
      gap: 8px;
      align-items: center;
      margin: 0;
      font-weight: 400
    }

    .wide {
      width: 100%;
      margin-top: 8px;
      padding: 12px
    }

    .note {
      color: var(--muted);
      font-size: 13px;
      margin: 14px 0 0;
      text-align: center
    }

    .paygrid {
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 20px;
      align-items: start
    }

    @media (max-width:760px) {
      .paygrid {
        grid-template-columns: 1fr
      }
    }

    .paygrid .panel {
      margin-top: 14px
    }

    .ln {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid var(--line)
    }

    .tot {
      font-weight: 700;
      font-size: 18px;
      border: 0
    }

    .sn {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-top: 1px solid var(--line)
    }

    .sn small {
      display: block;
      color: var(--muted)
    }

    .qty {
      display: flex;
      gap: 10px;
      align-items: center
    }

    .two {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px
    }

    #shows {
      scroll-margin-top: 90px
    }

    .flash {
      outline: 3px solid var(--accent);
      outline-offset: 4px;
      border-radius: 14px
    }
  </style>
</head>

<body>
  <header>
    <div class="wrap top">
      <button class="logo" id="home" aria-label="Showtime home">show<b>time</b></button>
      <input class="search" id="q" type="search" placeholder="Search for movies" aria-label="Search for movies">
      <select class="city" id="city" aria-label="City">
        <option>Varanasi</option>
        <option>Delhi NCR</option>
        <option>Mumbai</option>
        <option>Bengaluru</option>
        <option>Lucknow</option>
      </select>
      <button class="btn ghost" id="mine">My bookings <span id="cnt"></span></button><button class="btn"
        id="signin">Sign in</button><button class="btn ghost" id="signout" hidden>Sign out</button>
    </div>
  </header>

  <main class="wrap">
    <section class="view" id="v-home">
      <div class="hero" id="hero"></div>
      <div class="bar">
        <div class="chips" id="maintabs"></div>
        <div class="chips" id="chips"></div>
      </div>
      <div class="grid" id="grid"></div>
    </section>

    <section class="view" id="v-detail" hidden>
      <button class="back" data-back="home">← All movies</button>
      <div id="detail"></div>
    </section>

    <section class="view" id="v-seats" hidden>
      <button class="back" data-back="detail">← Change show</button>
      <h2 id="seat-title"></h2>
      <p id="seat-sub" style="color:var(--muted);margin:2px 0 6px"></p>
      <p style="margin:0 0 18px">Seats held for <b id="timer">5:00</b></p>
      <div class="panel">
        <div class="seatwrap">
          <div class="seatmap" id="seatmap"></div>
        </div>
        <div class="legend"><span>Available</span><span class="s">Selected</span><span class="b">Sold</span></div>
      </div>
      <div class="panel" id="snacks"></div>
      <div class="panel promo"><input id="promo" placeholder="Promo code (try SHOW10 or FIRST50)"
          aria-label="Promo code"><button class="btn" id="apply">Apply</button><span id="pmsg"></span></div>
      <div class="checkout">
        <div class="wrap">
          <div><b id="sum-main">Select up to 8 seats</b><small id="sum-sub"></small></div>
          <button class="btn" id="pay" disabled>Pay</button>
        </div>
      </div>
    </section>

    <section class="view" id="v-auth" hidden>
      <button class="back" data-back="home">← Back to movies</button>
      <div class="auth panel">
        <div class="tabs" id="tabs"></div>
        <form id="authform" novalidate></form>
        <p class="note">Accounts are stored only in this browser for the demo.</p>
      </div>
    </section>

    <section class="view" id="v-pay" hidden>
      <button class="back" data-back="seats">← Back to seats</button>
      <h2 style="margin-bottom:6px">Payment</h2>
      <div class="paygrid">
        <div class="panel">
          <div class="tabs" id="ptabs"></div>
          <form id="payform" novalidate></form>
        </div>
        <div class="panel" id="order"></div>
      </div>
    </section>

    <section class="view" id="v-mine" hidden>
      <button class="back" data-back="home">← All movies</button>
      <h2>My bookings</h2>
      <div id="minelist"></div>
    </section>

    <section class="view" id="v-done" hidden>
      <div class="center">
        <h2>Booking confirmed</h2>
        <p style="color:var(--muted)">Show this ticket at the cinema entrance.</p>
      </div>
      <div class="ticket" id="ticket"></div>
      <div class="center"><button class="btn" id="again">Book another movie</button></div>
    </section>
  </main>
  <div id="toast" role="status"></div>

  <script>
    /* ============================================================
       MOVIE PHOTOS (optional): to use your own photo for a movie,
       add  img:"banners/your-photo.jpg"  inside that movie below.
       Leave it out and the generated artwork is used instead.
       ============================================================ */
    const MOVIES = [
      { id: 1, t: "Midnight Express", l: "Hindi", g: ["Thriller", "Action"], r: 8.6, v: "84K", d: "2h 18m", c: "UA", a: "#7b1e3a", b: "#1b1d4e", s: "A night train, a stolen ledger and twelve hours to reach the border before the police do." },
      { id: 2, t: "Chai & Chaos", l: "Hindi", g: ["Comedy", "Drama"], r: 7.9, v: "41K", d: "2h 04m", c: "U", a: "#d9822b", b: "#8a2b4a", s: "Three siblings inherit a failing tea stall in Banaras and one very strange will." },
      { id: 3, t: "Orbit Zero", l: "English", g: ["Sci-Fi", "Adventure"], r: 8.9, v: "120K", d: "2h 41m", c: "UA", a: "#0f6d8c", b: "#1a1446", s: "A salvage crew finds a silent space station that is still counting down." },
      { id: 4, t: "Kaveri", l: "Tamil", g: ["Drama", "Romance"], r: 8.2, v: "29K", d: "2h 22m", c: "U", a: "#1f8a5b", b: "#124a5c", s: "Two river-boat pilots from rival families fall in love during a monsoon season." },

    function renderSnacks() { $("#snacks").innerHTML = `<h3>Grab a bite</h3>` + SNACKS.map(x => `<div class="sn"><span>${x.n}<small>₹${x.p}</small></span><span class="qty"><button class="chip" data-snack="${x.id}" data-d="-1" aria-label="Remove ${x.n}">−</button><b>${st.food[x.id] || 0}</b><button class="chip" data-snack="${x.id}" data-d="1" aria-label="Add ${x.n}">+</button></span></div>`).join("") }
    function renderPay() {
      const m = st.movie, t = THEATRES[st.theatre], d = dates()[st.date], T = totals();
      $("#order").innerHTML = `<h3>Order summary</h3><p><b>${m.t}</b><br>${t.n}<br>${d.toLocaleDateString("en-IN", { weekday: "short", day: "numeric", month: "short" })} · ${st.time}<br>Seats ${st.seats.join(", ")}</p>
  <div class="ln"><span>Tickets</span><span>₹${T.sub}</span></div>${T.food ? `<div class="ln"><span>Food and drinks</span><span>₹${T.food}</span></div>` : ""}<div class="ln"><span>Convenience fee</span><span>₹${T.fee}</span></div>${T.disc ? `<div class="ln"><span>Promo ${st.promo}</span><span>− ₹${T.disc}</span></div>` : ""}<div class="ln tot"><span>Total</span><span>₹${T.total}</span></div>`;
      $("#ptabs").innerHTML = [["upi", "UPI"], ["card", "Card"], ["net", "Net banking"]].map(([k, l]) => `<button type="button" class="tab" data-pm="${k}" aria-pressed="${st.pay === k}">${l}</button>`).join("");
      $("#payform").innerHTML = (st.pay === "upi" ? fld("upi", "UPI ID", "text", "name@bank", "off") : st.pay === "card" ? fld("card", "Card number", "text", "1234 5678 9012 3456", "cc-number") + fld("cname", "Name on card", "text", "", "cc-name") + `<div class="two"><div>${fld("exp", "Expiry (MM/YY)", "text", "08/28", "cc-exp")}</div><div>${fld("cvv", "CVV", "password", "3 digits", "cc-csc")}</div></div>`
        : `<label for="a-bank">Select your bank</label><select id="a-bank">${["State Bank of India", "HDFC Bank", "ICICI Bank", "Axis Bank", "Punjab National Bank"].map(b => `<option>${b}</option>`).join("")}</select>`)
        + `<button class="btn wide" type="submit" id="paybtn">Pay ₹${T.total}</button>`
    }
    const luhn = n => { let s = 0, f = false; for (let i = n.length - 1; i >= 0; i--) { let d = +n[i]; if (f) { d *= 2; if (d > 9) d -= 9 } s += d; f = !f } return s % 10 === 0 };
    $("#payform").addEventListener("submit", e => {
      e.preventDefault(); let ok = true; document.querySelectorAll("#payform .err").forEach(x => x.textContent = "");
      const v = id => ($("#a-" + id) || { value: "" }).value.trim(), bad = (id, t) => { $("#e-" + id).textContent = t; ok = false };
      if (st.pay === "upi" && !/^[\w.\-]{2,}@[a-zA-Z]{2,}$/.test(v("upi"))) bad("upi", "Enter a valid UPI ID, for example name@okbank");
      if (st.pay === "card") {
        const n = v("card").replace(/\s/g, ""); if (!/^\d{13,19}$/.test(n) || !luhn(n)) bad("card", "Enter a valid card number");
        if (v("cname").length < 2) bad("cname", "Enter the name on the card");
        const m = v("exp").match(/^(\d\d)\/(\d\d)$/), now = new Date(); if (!m || +m[1] < 1 || +m[1] > 12 || (2000 + +m[2]) * 12 + +m[1] < now.getFullYear() * 12 + now.getMonth() + 1) bad("exp", "Enter a valid, unexpired date");
        if (!/^\d{3,4}$/.test(v("cvv"))) bad("cvv", "Enter the 3 or 4 digit CVV")
      }
      if (!ok) return; const btn = $("#paybtn"); btn.disabled = true; btn.textContent = "Processing payment…"; setTimeout(confirm, 1600)
    });
    document.addEventListener("input", e => {
      const i = e.target; if (i.id === "a-card") i.value = i.value.replace(/\D/g, "").slice(0, 19).replace(/(.{4})/g, "$1 ").trim();
      if (i.id === "a-exp") { const d = i.value.replace(/\D/g, "").slice(0, 4); i.value = d.length > 2 ? d.slice(0, 2) + "/" + d.slice(2) : d }
    });
    function qr(id) {
      let q = hash(id); const R = () => (q = (Math.imul(q, 1103515245) + 12345) >>> 0) / 4294967296; let o = "";
      for (let y = 0; y < 21; y++)for (let x = 0; x < 21; x++) {
        const f = (x < 7 && y < 7) || (x > 13 && y < 7) || (x < 7 && y > 13); let on;
        if (f) { const ex = x > 13 ? x - 14 : x, ey = y > 13 ? y - 14 : y; on = ex === 0 || ex === 6 || ey === 0 || ey === 6 || (ex >= 2 && ex <= 4 && ey >= 2 && ey <= 4) } else on = R() > .5;
        if (on) o += `<rect x="${x}" y="${y}" width="1" height="1"/>`
      }
      return `<svg viewBox="0 0 21 21" width="130" height="130" fill="currentColor" style="margin-top:10px" role="img" aria-label="Ticket QR code">${o}</svg>`
    }

    /* TICKET + BOOKINGS */
    let BK = []; const bkKey = () => "st_bk_" + ME;
    function loadBK() { BK = []; if (ME) try { BK = JSON.parse(localStorage.getItem(bkKey()) || "[]") } catch (e) { } }
    const save = () => { if (ME) try { localStorage.setItem(bkKey(), JSON.stringify(BK)) } catch (e) { } };
    function renderTicket(k) {
      const m = MOVIES.find(x => x.id === k.mid);
      $("#ticket").innerHTML = `<div class="head" style="background:${grad(m)}"><small>${m.l} · ${m.c}</small><h2>${m.t}</h2></div>
  <div class="body"><div><small>Date</small>${k.date}</div><div><small>Time</small>${k.time}</div>
  <div style="grid-column:1/-1"><small>Cinema</small>${k.cinema}</div><div><small>Seats</small>${k.seats.join(", ")}</div><div><small>Paid</small>₹${k.total}</div></div>
  <div class="stub"><small style="color:var(--muted)">Booking ID</small><b>${k.id}</b>${qr(k.id)}</div>`
    }
    function renderMine() {
      $("#cnt").textContent = BK.length ? `(${BK.length})` : "";
      $("#minelist").innerHTML = BK.length ? BK.map(k => `<div class="panel bk"><div><h3>${k.title}</h3><p>${k.cinema} · ${k.date} · ${k.time}<br>Seats ${k.seats.join(", ")} · ₹${k.total}</p></div><div><button class="btn" data-view="${k.id}">View ticket</button> <button class="chip" data-cancel="${k.id}">Cancel</button></div></div>`).join("") : `<p class="empty">No bookings yet. Pick a movie to get started.</p>`
    }
    function confirm() {
      const t = THEATRES[st.theatre], d = dates()[st.date], T = totals();
      const k = {
        id: "ST" + (hash(Date.now() + st.seats.join()) % 900000 + 100000), mid: st.movie.id, title: st.movie.t, cinema: `${t.n}, ${t.a}`,
        date: d.toLocaleDateString("en-IN", { weekday: "short", day: "numeric", month: "short" }), time: st.time, seats: [...st.seats], total: T.total
      };
      BK.unshift(k); save(); renderMine(); renderTicket(k); st.seats = []; st.food = {}; show("done")
    }

    /* EVENTS */
    document.addEventListener("click", e => {
      const b = e.target.closest("button"); if (!b) return;
      if (b.dataset.open) { st.movie = MOVIES.find(m => m.id == b.dataset.open); st.date = 0; st.slot = "All"; renderDetail(); show("detail") }
      else if (b.dataset.slide) { st.slide = +b.dataset.slide; renderHero() }
      else if (b.dataset.lang) { st.lang = b.dataset.lang; renderChips(); renderGrid() }
      else if (b.dataset.date) { st.date = +b.dataset.date; document.querySelectorAll(".date").forEach(x => x.setAttribute("aria-pressed", x === b)); renderTheatres() }
      else if (b.dataset.time) { st.theatre = +b.dataset.th; st.time = b.dataset.time; st.seats = []; st.food = {}; st.promo = null; st.hold = Date.now() + 300000; renderSeats(); show("seats") }
      else if (b.dataset.seat) {
        const id = b.dataset.seat, i = st.seats.indexOf(id);
        if (i > -1) st.seats.splice(i, 1); else if (st.seats.length >= MAXSEATS) return toast("You can book up to 8 seats at a time"); else st.seats.push(id);
        b.classList.toggle("sel", st.seats.includes(id)); updateSummary()
      }
      else if (b.dataset.view) { renderTicket(BK.find(x => x.id === b.dataset.view)); show("done") }
      else if (b.dataset.cancel) { BK = BK.filter(x => x.id !== b.dataset.cancel); save(); renderMine(); toast("Booking cancelled. Refund in 5–7 days") }
      else if (b.dataset.tab) { st.tab = b.dataset.tab; renderChips(); renderGrid() }
      else if (b.dataset.notify) { const i = +b.dataset.notify; NOT = NOT.includes(i) ? NOT.filter(x => x !== i) : [...NOT, i]; try { localStorage.setItem("st_notify", JSON.stringify(NOT)) } catch (x) { } renderGrid(); toast(NOT.includes(i) ? "We will remind you on release day" : "Reminder removed") }
      else if (b.dataset.slot) { st.slot = b.dataset.slot; document.querySelectorAll("#slots .chip").forEach(x => x.setAttribute("aria-pressed", x === b)); renderTheatres() }
      else if (b.dataset.snack) { const i = b.dataset.snack; st.food[i] = Math.max(0, Math.min(10, (st.food[i] || 0) + +b.dataset.d)); renderSnacks(); updateSummary() }
      else if (b.dataset.pm) { st.pay = b.dataset.pm; renderPay() }
      else if (b.dataset.scroll) { const el = $("#" + b.dataset.scroll); el.scrollIntoView({ behavior: "smooth", block: "start" }); el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 1400) }
      else if (b.dataset.back) { show(b.dataset.back) }
      else if (b.id === "home" || b.id === "again") { st.seats = []; show("home") }
      else if (b.id === "pay") checkout();
      else if (b.id === "mine") { if (!ME) return openAuth("signin", "mine"); renderMine(); show("mine") }
      else if (b.id === "apply") {
        const c = $("#promo").value.trim().toUpperCase(); if (!st.seats.length) return toast("Select seats first");
        if (c === "SHOW10" || c === "FIRST50") { st.promo = c; $("#pmsg").textContent = c + " applied" } else { st.promo = null; $("#pmsg").textContent = "Code not valid" } updateSummary()
      }
      else if (b.dataset.auth) { openAuth(b.dataset.auth) }
      else if (b.dataset.eye) { const i = $("#a-" + b.dataset.eye); i.type = i.type === "password" ? "text" : "password"; b.textContent = i.type === "password" ? "Show" : "Hide" }
      else if (b.id === "signout") logout();
      else if (b.id === "signin") { if (ME) { renderMine(); show("mine") } else openAuth("signin", "home") }
    });
    $("#q").addEventListener("input", e => { st.q = e.target.value; show("home"); renderGrid() });
    $("#city").value = CITY;
    $("#city").addEventListener("change", e => {
      CITY = e.target.value; THEATRES = cityTh(CITY); try { localStorage.setItem("st_city", CITY) } catch (x) { } toast("Showing cinemas in " + CITY);
      if (!$("#v-detail").hidden) renderTheatres(); else if (!$("#v-seats").hidden || !$("#v-pay").hidden) show("home")
    });
    renderHero(); renderChips(); renderGrid(); loadBK(); renderAuthUI(); renderMine(); seed();
    setInterval(() => { if ($("#v-seats").hidden) return; const r = Math.max(0, st.hold - Date.now()); $("#timer").textContent = Math.floor(r / 60000) + ":" + String(Math.floor(r / 1000) % 60).padStart(2, "0"); if (!r) { st.seats = []; toast("Seat hold expired. Please choose again."); show("detail") } }, 1000);
    if (!matchMedia("(prefers-reduced-motion:reduce)").matches) setInterval(() => { if (!$("#v-home").hidden) { st.slide = (st.slide + 1) % BANNERS.length; renderHero() } }, 5000);
  </script>
</body>

</html>
